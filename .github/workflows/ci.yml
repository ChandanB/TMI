name: Apple Platforms CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODE_VERSION: "26.6"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone 17 Pro
            id: iphone-17-pro
            destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
          - name: iPad Pro 13-inch
            id: ipad-pro-13
            destination: platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.5
          - name: macOS
            id: macos
            destination: platform=macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode selection
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode ${XCODE_VERSION}"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('TMI.xcodeproj/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Resolve locked Swift packages
        env:
          SOURCE_PACKAGES_PATH: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TMI.xcodeproj \
            -scheme TMI \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Run Swift and UI tests
        env:
          DESTINATION: ${{ matrix.destination }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/TMI-${{ matrix.id }}-DerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/TMI-${{ matrix.id }}-Tests.xcresult
          SOURCE_PACKAGES_PATH: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild test \
            -project TMI.xcodeproj \
            -scheme TMI \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RESULT_BUNDLE_PATH"

      - name: Upload test result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-tests-${{ matrix.id }}
          path: ${{ runner.temp }}/TMI-${{ matrix.id }}-Tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  release-build:
    name: Release build (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            id: ios-simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            id: macos
            destination: platform=macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Xcode selection
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode ${XCODE_VERSION}"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('TMI.xcodeproj/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Resolve locked Swift packages
        env:
          SOURCE_PACKAGES_PATH: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TMI.xcodeproj \
            -scheme TMI \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Build Release configuration
        env:
          DESTINATION: ${{ matrix.destination }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/TMI-${{ matrix.id }}-Release-DerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/TMI-${{ matrix.id }}-Release.xcresult
          SOURCE_PACKAGES_PATH: ${{ runner.temp }}/SourcePackages
        run: |
          xcodebuild build \
            -project TMI.xcodeproj \
            -scheme TMI \
            -configuration Release \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apple-release-${{ matrix.id }}
          path: ${{ runner.temp }}/TMI-${{ matrix.id }}-Release.xcresult
          if-no-files-found: warn
          retention-days: 14
